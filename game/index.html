<!doctype html>

<title>Prism Break</title>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e1a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

</style>
</head>
<body>
<canvas id="game" aria-label="Prism Break: move the paddle to bounce the ball, break the bricks, bend the ball's light through prisms to open sealed bricks"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
